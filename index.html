<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>AgendaBb</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#e8f0e2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="AgendaBb" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #f7f3e8; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    :root {
      --bg-primary: #ffffff; --bg-secondary: #f5f5f0; --bg-tertiary: #f7f3e8;
      --text-primary: #1a1a1a; --text-secondary: #666660; --text-tertiary: #aaa;
      --border: rgba(0,0,0,0.12); --border-med: rgba(0,0,0,0.22);
      --red: #c0392b; --red-dark: #a93226; --radius-md: 8px; --radius-lg: 12px;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-primary: #1e1e1e; --bg-secondary: #2a2a2a; --bg-tertiary: #141414;
        --text-primary: #f0f0f0; --text-secondary: #aaa; --text-tertiary: #666;
        --border: rgba(255,255,255,0.1); --border-med: rgba(255,255,255,0.2);
      }
      body { background: var(--bg-tertiary); }
      .header { background: #1a2a1a !important; }
      .week-nav { background: #1c251c !important; }
      .ring { border-color: #888 !important; }
    }
    .app { max-width: 430px; margin: 0 auto; background: var(--bg-tertiary); height: 100dvh; display: flex; flex-direction: column; }
    .header { display: flex; align-items: center; padding: 8px 10px; background: #e8f0e2; border-bottom: 0.5px solid var(--border); flex-shrink: 0; }
    .hdr-pill { background: var(--bg-primary); border-radius: var(--radius-md); border: 0.5px solid var(--border); padding: 4px 10px; font-size: 13px; display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
    .hdr-pill:hover { background: var(--bg-secondary); }
    .hdr-pill strong { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .hdr-pill span { font-size: 11px; color: var(--text-secondary); }
    .week-nav { display: flex; align-items: center; justify-content: space-between; padding: 4px 10px; background: #f0f5ec; flex-shrink: 0; }
    .week-nav button { background: none; border: none; cursor: pointer; color: var(--text-secondary); font-size: 24px; padding: 0 6px; line-height: 1; }
    .week-nav span { font-size: 12px; color: var(--text-secondary); font-weight: 500; }
    .notebook { flex: 1; overflow: hidden; display: flex; flex-direction: column; min-height: 0; }
    .page { display: grid; grid-template-columns: 1fr 18px 1fr; flex: 1; min-height: 0; }
    .spiral-col { display: flex; flex-direction: column; align-items: center; padding: 4px 0; pointer-events: none; }
    .ring { width: 13px; height: 9px; border: 2.5px solid #555; border-radius: 50% 50% 0 0 / 60% 60% 0 0; margin: 1.5px 0; }
    .left-col, .right-col { display: flex; flex-direction: column; padding: 4px; gap: 5px; min-height: 0; }
    .right-col { padding-left: 0; }
    .day-card { background: var(--bg-primary); border: 0.5px solid var(--border); border-radius: var(--radius-lg); overflow: hidden; display: flex; flex-direction: column; flex: 1 1 0; min-height: 50px; transition: flex 0.2s ease; }
    .day-card.active { flex: 3 1 0; }
    .weekend-wrap { display: flex; flex-direction: column; flex: 1; gap: 5px; min-height: 0; }
    .weekend-wrap .day-card { flex: 1; }
    .day-hdr { display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-bottom: 0.5px solid var(--border); background: var(--bg-secondary); flex-shrink: 0; cursor: pointer; }
    .dow { font-size: 10px; color: var(--text-secondary); font-weight: 500; text-transform: uppercase; }
    .num { font-size: 16px; font-weight: 500; color: var(--text-primary); line-height: 1; }
    .mon-lbl { font-size: 10px; color: var(--text-tertiary); }
    .day-hdr.today { background: var(--red); }
    .day-hdr.today .dow, .day-hdr.today .num, .day-hdr.today .mon-lbl { color: #fff; }
    .day-body { flex: 1; overflow-y: auto; position: relative; cursor: text; min-height: 0; }
    .day-lines { position: absolute; left: 0; right: 0; top: 0; height: max(100%, 300px); background: repeating-linear-gradient(to bottom, transparent, transparent 21px, var(--border) 21px, var(--border) 22px); pointer-events: none; }
    .day-editor { position: relative; z-index: 1; min-height: 100%; padding: 3px 6px 3px 8px; font-size: 13px; line-height: 22px; color: var(--text-primary); font-family: inherit; word-break: break-word; outline: none; cursor: text; caret-color: var(--red); }



    .day-editor ul { margin: 0; padding-left: 16px; list-style: disc; }
    .day-editor ul li { line-height: 22px; padding: 0; margin: 0; }
    .toolbar { display: none; flex-shrink: 0; background: var(--bg-primary); border-top: 0.5px solid var(--border-med); padding: 5px 8px; gap: 3px; flex-wrap: wrap; align-items: center; width: 100%; z-index: 999; }
    .toolbar.show { display: flex; }
    .toolbar.floating { position: fixed; left: 0; right: 0; max-width: 430px; margin: 0 auto; }
    .tb-sep { width: 0.5px; height: 20px; background: var(--border-med); margin: 0 3px; }
    .tb-btn { width: 32px; height: 30px; border: none; background: none; cursor: pointer; border-radius: var(--radius-md); display: flex; align-items: center; justify-content: center; font-size: 14px; color: var(--text-primary); flex-shrink: 0; font-family: inherit; }
    .tb-btn:hover { background: var(--bg-secondary); }
    .tb-btn.on { background: var(--red); color: #fff; }
    .size-select { height: 28px; border: 0.5px solid var(--border-med); border-radius: var(--radius-md); background: var(--bg-secondary); font-size: 11px; color: var(--text-primary); padding: 0 3px; cursor: pointer; outline: none; width: 56px; }
    .color-picker-wrap { position: relative; }
    .color-dot { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid var(--border-med); cursor: pointer; flex-shrink: 0; }
    .color-menu { display: none; position: absolute; bottom: 36px; left: 0; background: var(--bg-primary); border: 0.5px solid var(--border-med); border-radius: var(--radius-md); padding: 8px; gap: 6px; flex-wrap: wrap; width: 140px; z-index: 1000; }
    .color-menu.show { display: flex; }
    .cm-dot { width: 22px; height: 22px; border-radius: 50%; cursor: pointer; border: 1.5px solid transparent; flex-shrink: 0; }
    .cm-dot:hover { border-color: var(--border-med); }
    .cm-dot.active { border-color: var(--red); border-width: 2.5px; }
    .bottom-nav { display: flex; background: var(--bg-primary); border-top: 0.5px solid var(--border-med); flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom); }
    .nav-btn { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 7px 0; gap: 2px; border: none; background: none; cursor: pointer; color: var(--text-secondary); font-size: 10px; font-family: inherit; }
    .nav-btn i { font-size: 22px; }
    .nav-btn.active { color: var(--red); }
    .overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 100; align-items: flex-end; }
    .overlay.show { display: flex; }
    .panel { background: var(--bg-primary); width: 100%; border-radius: 16px 16px 0 0; padding: 16px; max-height: 85vh; overflow-y: auto; padding-bottom: calc(16px + env(safe-area-inset-bottom)); }
    .panel-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    .panel-hdr h3 { font-size: 15px; font-weight: 500; color: var(--text-primary); }
    .close-btn { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--text-secondary); line-height: 1; }
    .notes-area { width: 100%; min-height: 180px; padding: 10px; border-radius: var(--radius-md); border: 0.5px solid var(--border-med); background: var(--bg-secondary); font-size: 14px; color: var(--text-primary); font-family: inherit; resize: none; line-height: 1.6; }
    .save-btn { margin-top: 8px; width: 100%; padding: 10px; background: var(--red); color: #fff; border: none; border-radius: var(--radius-md); cursor: pointer; font-size: 14px; font-family: inherit; }
    .section-title { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin: 14px 0 6px; text-transform: uppercase; letter-spacing: 0.04em; }
    .io-row { display: flex; gap: 8px; }
    .io-btn { flex: 1; padding: 9px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .io-btn.export { background: var(--bg-secondary); border: 0.5px solid var(--border-med); color: var(--text-primary); }
    .io-btn.import { background: var(--bg-secondary); border: 0.5px solid var(--border-med); color: var(--text-primary); }
    .io-btn:hover { background: var(--border); }
    .io-note { font-size: 11px; color: var(--text-tertiary); margin-top: 6px; line-height: 1.5; }
    .update-banner { display: none; background: #1e8449; color: #fff; font-size: 12px; padding: 7px 12px; text-align: center; cursor: pointer; flex-shrink: 0; }
    .update-banner.show { display: block; }
    .cal-wrap { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; align-items: center; justify-content: center; }
    .cal-wrap.show { display: flex; }
    .cal-box { background: var(--bg-primary); width: 90%; max-width: 320px; border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 16px; }
    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .cal-nav button { background: none; border: none; cursor: pointer; font-size: 22px; color: var(--text-secondary); padding: 0 6px; }
    .cal-nav span { font-size: 14px; font-weight: 500; color: var(--text-primary); }
    .cgrid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; text-align: center; }
    .cdh { font-size: 10px; color: var(--text-secondary); padding: 3px 0; font-weight: 500; }
    .cd { font-size: 13px; padding: 7px 2px; border-radius: var(--radius-md); color: var(--text-primary); cursor: pointer; }
    .cd:hover, .cd:active { background: var(--bg-secondary); }
    .cd.cur-week { background: #f5e8e8; }
    .cd.today-c { background: var(--red) !important; color: #fff !important; }
    .cd.empty { cursor: default; pointer-events: none; }
    .cal-close-btn { margin-top: 12px; width: 100%; padding: 8px; border: 0.5px solid var(--border-med); border-radius: var(--radius-md); background: none; cursor: pointer; font-size: 13px; color: var(--text-secondary); font-family: inherit; }

    /* DAY VIEW */
    .day-view{display:none;position:fixed;inset:0;background:var(--bg-primary);z-index:50;flex-direction:column;max-width:430px;margin:0 auto;}
    .day-view.open{display:flex;}
    .dv-header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:#e8f0e2;border-bottom:0.5px solid var(--border);flex-shrink:0;}
    .dv-back{background:none;border:none;cursor:pointer;font-size:22px;color:var(--text-secondary);padding:0 2px;line-height:1;font-family:inherit;}
    .dv-back:hover{color:var(--text-primary);}
    .dv-title{flex:1;}
    .dv-dow{font-size:11px;color:var(--text-secondary);font-weight:500;text-transform:uppercase;}
    .dv-date{font-size:18px;font-weight:500;color:var(--text-primary);line-height:1.2;}
    .dv-nav{display:flex;gap:4px;}
    .dv-nav button{width:32px;height:32px;background:var(--bg-secondary);border:0.5px solid var(--border-med);border-radius:var(--radius-md);cursor:pointer;font-size:18px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;font-family:inherit;}
    .dv-nav button:hover{background:var(--bg-primary);}
    .dv-body{flex:1;overflow-y:auto;position:relative;min-height:0;}
    .dv-lines{position:absolute;left:0;right:0;top:0;height:max(100%,800px);background:repeating-linear-gradient(to bottom,transparent,transparent 26px,var(--border) 26px,var(--border) 27px);pointer-events:none;}
    .dv-editor{position:relative;z-index:1;min-height:100%;padding:6px 16px;font-size:15px;line-height:27px;color:var(--text-primary);font-family:inherit;word-break:break-word;outline:none;cursor:text;caret-color:var(--red);}
    .dv-editor ul{margin:0;padding-left:20px;list-style:disc;}
    .dv-editor ul li{line-height:27px;padding:0;margin:0;}
    .day-hdr{transition:filter 0.15s;}
    .day-hdr:hover{filter:brightness(0.93);}
    .day-hdr:active{filter:brightness(0.87);}
    .day-hdr.today:hover{filter:brightness(1.1);}
  </style>
</head>
<body>
<div class="app">
  <div class="update-banner" id="update-banner">
    Aggiornamento disponibile — tocca per ricaricare
  </div>
  <div class="header">
    <div class="hdr-pill" id="open-cal" role="button" aria-label="Apri calendario">
      <i class="ti ti-calendar" aria-hidden="true"></i>
      <strong id="hdr-month"></strong>
      <span id="hdr-week"></span>
      <i class="ti ti-chevron-down" style="font-size:12px;color:var(--text-tertiary);" aria-hidden="true"></i>
    </div>
  </div>
  <div class="week-nav">
    <button id="prev-btn" aria-label="Settimana precedente">&#8249;</button>
    <span id="week-range"></span>
    <button id="next-btn" aria-label="Settimana successiva">&#8250;</button>
  </div>
  <div class="notebook" id="notebook">
    <div class="page" id="main-page">
      <div class="left-col" id="left-col"></div>
      <div class="spiral-col" id="spiral-col"></div>
      <div class="right-col" id="right-col"></div>
    </div>
  </div>
  <div class="toolbar" id="toolbar">
    <button class="tb-btn" id="tb-bold" title="Grassetto"><b>B</b></button>
    <button class="tb-btn" id="tb-italic" title="Corsivo"><i>I</i></button>
    <button class="tb-btn" id="tb-under" title="Sottolineato"><u>U</u></button>
    <button class="tb-btn" id="tb-strike" title="Barrato"><s>S</s></button>
    <div class="tb-sep"></div>
    <select class="size-select" id="tb-size" title="Dimensione testo">
      <option value="9">9</option><option value="9.5">9.5</option>
      <option value="10">10</option><option value="10.5">10.5</option>
      <option value="11">11</option><option value="11.5">11.5</option>
      <option value="12">12</option><option value="12.5">12.5</option>
      <option value="13" selected>13</option><option value="13.5">13.5</option>
      <option value="14">14</option><option value="14.5">14.5</option>
      <option value="15">15</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="tb-ul" title="Elenco puntato"><i class="ti ti-list" aria-hidden="true"></i></button>
    <div class="tb-sep"></div>
    <div class="color-picker-wrap">
      <div class="color-dot" id="cur-color" style="background:#1a1a1a;" title="Colore testo" role="button" aria-label="Scegli colore"></div>
      <div class="color-menu" id="color-menu">
        <div class="cm-dot active" data-color="#1a1a1a" style="background:#1a1a1a;"></div>
        <div class="cm-dot" data-color="#c0392b" style="background:#c0392b;"></div>
        <div class="cm-dot" data-color="#2471a3" style="background:#2471a3;"></div>
        <div class="cm-dot" data-color="#1e8449" style="background:#1e8449;"></div>
        <div class="cm-dot" data-color="#d4ac0d" style="background:#d4ac0d;"></div>
        <div class="cm-dot" data-color="#884ea0" style="background:#884ea0;"></div>
        <div class="cm-dot" data-color="#e67e22" style="background:#e67e22;"></div>
        <div class="cm-dot" data-color="#aaa" style="background:#aaa;"></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav" id="bottom-nav">
    <button class="nav-btn active" id="nav-agenda"><i class="ti ti-notebook"></i>Agenda</button>
    <button class="nav-btn" id="nav-appunti"><i class="ti ti-notes"></i>Appunti</button>
    <button class="nav-btn" id="nav-oggi"><i class="ti ti-calendar-event"></i>Oggi</button>
    <button class="nav-btn" id="nav-menu"><i class="ti ti-settings"></i>Menu</button>
  </div>
</div>


<!-- DAY VIEW -->
<div class="day-view" id="day-view">
  <div class="dv-header">
    <button class="dv-back" id="dv-back" aria-label="Torna">&#8592;</button>
    <div class="dv-title">
      <div class="dv-dow" id="dv-dow"></div>
      <div class="dv-date" id="dv-date"></div>
    </div>
    <div class="dv-nav">
      <button id="dv-prev" aria-label="Giorno precedente">&#8249;</button>
      <button id="dv-next" aria-label="Giorno successivo">&#8250;</button>
    </div>
  </div>
  <div class="dv-body" id="dv-body">
    <div class="dv-lines"></div>
    <div class="dv-editor" id="dv-editor" contenteditable="true" spellcheck="true"></div>
  </div>
  <div class="toolbar" id="toolbar-dv">
    <button class="tb-btn" id="dv-bold" title="Grassetto"><b>B</b></button>
    <button class="tb-btn" id="dv-italic" title="Corsivo"><i>I</i></button>
    <button class="tb-btn" id="dv-under" title="Sottolineato"><u>U</u></button>
    <button class="tb-btn" id="dv-strike" title="Barrato"><s>S</s></button>
    <div class="tb-sep"></div>
    <select class="size-select" id="dv-size" title="Dimensione">
      <option value="9">9</option><option value="9.5">9.5</option>
      <option value="10">10</option><option value="10.5">10.5</option>
      <option value="11">11</option><option value="11.5">11.5</option>
      <option value="12">12</option><option value="12.5">12.5</option>
      <option value="14" selected>14</option><option value="14.5">14.5</option>
      <option value="15">15</option>
    </select>
    <div class="tb-sep"></div>
    <button class="tb-btn" id="dv-ul" title="Elenco puntato"><i class="ti ti-list" aria-hidden="true"></i></button>
    <div class="tb-sep"></div>
    <div class="color-picker-wrap">
      <div class="color-dot" id="dv-cur-color" style="background:#1a1a1a;" role="button" aria-label="Colore"></div>
      <div class="color-menu" id="dv-color-menu">
        <div class="cm-dot active" data-color="#1a1a1a" style="background:#1a1a1a;"></div>
        <div class="cm-dot" data-color="#c0392b" style="background:#c0392b;"></div>
        <div class="cm-dot" data-color="#2471a3" style="background:#2471a3;"></div>
        <div class="cm-dot" data-color="#1e8449" style="background:#1e8449;"></div>
        <div class="cm-dot" data-color="#d4ac0d" style="background:#d4ac0d;"></div>
        <div class="cm-dot" data-color="#884ea0" style="background:#884ea0;"></div>
        <div class="cm-dot" data-color="#e67e22" style="background:#e67e22;"></div>
        <div class="cm-dot" data-color="#aaa" style="background:#aaa;"></div>
      </div>
    </div>
  </div>
  <div class="bottom-nav">
    <button class="nav-btn active"><i class="ti ti-notebook"></i>Agenda</button>
    <button class="nav-btn" id="dv-nav-appunti"><i class="ti ti-notes"></i>Appunti</button>
    <button class="nav-btn" id="dv-nav-oggi"><i class="ti ti-calendar-event"></i>Oggi</button>
    <button class="nav-btn" id="dv-nav-menu"><i class="ti ti-settings"></i>Menu</button>
  </div>
</div>
<div class="overlay" id="appunti-overlay">
  <div class="panel">
    <div class="panel-hdr"><h3>Appunti</h3><button class="close-btn" id="appunti-close" aria-label="Chiudi">&#x2715;</button></div>
    <textarea class="notes-area" id="notes-area" placeholder="Scrivi i tuoi appunti qui..."></textarea>
    <button class="save-btn" id="save-note-btn">Salva appunti</button>
  </div>
</div>

<div class="overlay" id="menu-overlay">
  <div class="panel">
    <div class="panel-hdr"><h3>Menu</h3><button class="close-btn" id="menu-close" aria-label="Chiudi">&#x2715;</button></div>
    <div class="section-title">Backup dati</div>
    <div class="io-row">
      <button class="io-btn export" id="btn-export"><i class="ti ti-download" aria-hidden="true"></i> Esporta</button>
      <button class="io-btn import" id="btn-import"><i class="ti ti-upload" aria-hidden="true"></i> Importa</button>
    </div>
    <input type="file" id="file-input" accept=".json" style="display:none" />
    <p class="io-note">Esporta salva un file JSON con tutti i tuoi dati. Importa su un nuovo device per ripristinare tutto.</p>
  </div>
</div>

<div class="cal-wrap" id="cal-wrap">
  <div class="cal-box" id="cal-box">
    <div class="cal-nav">
      <button id="cal-prev" aria-label="Mese precedente">&#8249;</button>
      <span id="cal-label"></span>
      <button id="cal-next" aria-label="Mese successivo">&#8250;</button>
    </div>
    <div class="cgrid" id="cgrid"></div>
    <button class="cal-close-btn" id="cal-close">Chiudi</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
